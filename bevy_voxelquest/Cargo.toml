[package]
name = "bevy_voxelquest"
version = "0.1.0"
edition = "2024"
license = "Zlib"
description = "Voxel Quest's procedural ray-marched voxel rendering (and optional physics) as Bevy plugins"

[features]
default = ["physics", "pixelate"]
physics = ["dep:avian3d"]
# The low-resolution look (`VqPixelate`) presents through Bevy UI.
pixelate = ["bevy/bevy_ui", "bevy/bevy_ui_render"]

[dependencies]
# Only what the renderer needs, so apps that trim Bevy's features keep them trimmed.
bevy = { version = "0.19", default-features = false, features = ["std", "bevy_log", "3d_bevy_render"] }
avian3d = { version = "0.7", optional = true }
serde_json = "1"

[dev-dependencies]
bevy = "0.19"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
